services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hydrofodder
      POSTGRES_USER: hydrofodder
      POSTGRES_PASSWORD: hydrofodder_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 hydrofodder.asgi:application
    ports: ["8000:8000"]
    environment:
      DEBUG: "1"
      SECRET_KEY: docker-dev-key-change-me
      ALLOWED_HOSTS: 127.0.0.1,localhost,0.0.0.0
      DATABASE_URL: postgresql://hydrofodder:hydrofodder_dev@postgres:5432/hydrofodder
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
  worker:
    build: .
    command: celery -A hydrofodder worker -l info
    environment:
      DEBUG: "1"
      SECRET_KEY: docker-dev-key-change-me
      DATABASE_URL: postgresql://hydrofodder:hydrofodder_dev@postgres:5432/hydrofodder
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
  beat:
    build: .
    command: celery -A hydrofodder beat -l info
    environment:
      DEBUG: "1"
      SECRET_KEY: docker-dev-key-change-me
      DATABASE_URL: postgresql://hydrofodder:hydrofodder_dev@postgres:5432/hydrofodder
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
volumes: {pgdata: {}}
