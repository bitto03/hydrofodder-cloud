<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>{% block title %}HydroFodder Cloud{% endblock %}</title><link rel='stylesheet' href='/static/css/app.css'></head><body>
<nav><a href='/' class='brand'>HydroFodder Cloud</a><div>{% if user.is_authenticated %}<span>{{ user.email }}</span> <a href='/devices/add/'>Add Device</a> <form method='post' action='/accounts/logout/' class='inline'>{% csrf_token %}<button class='linkbtn'>Logout</button></form>{% else %}<a href='/accounts/login/'>Login</a> <a href='/accounts/register/'>Register</a>{% endif %}</div></nav>
<main>{% for message in messages %}<div class='flash'>{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
